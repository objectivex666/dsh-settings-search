name: Publish to npm

# 发布流程：改 package.json 版本 → commit → 打 vX.Y.Z 标签并推送 → 自动发布到 npm。
# 手动触发（workflow_dispatch）需要显式传入 expected_version，且必须匹配 package.json。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Must match package.json version exactly'
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm provenance（来源证明）所需

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Guard — published artifact must match declared version
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            EXPECTED="${GITHUB_REF_NAME#v}"
          else
            EXPECTED="${{ github.event.inputs.expected_version }}"
          fi
          echo "trigger=${GITHUB_REF_TYPE} version=${PKG_VERSION} declared=${EXPECTED}"
          if [ "$PKG_VERSION" != "$EXPECTED" ]; then
            echo "::error::Version mismatch: package.json=${PKG_VERSION}, declared=${EXPECTED}"
            exit 1
          fi


      - name: Guard — validate semver increment from latest published version
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          LATEST=$(npm view "${NAME}" version 2>/dev/null || echo "0.0.0")
          node -e "
            const [nMaj,nMin,nPat] = process.argv[1].split('.').map(Number);
            const [pMaj,pMin,pPat] = process.argv[2].split('.').map(Number);
            const ok =
              (nMaj===pMaj+1 && nMin===0 && nPat===0) ||
              (nMaj===pMaj && nMin===pMin+1 && nPat===0) ||
              (nMaj===pMaj && nMin===pMin && nPat===pPat+1);
            if (!ok) { console.error('::error::'+process.argv[1]+' is not a strict semver bump from '+process.argv[2]); process.exit(1); }
            console.log('OK: '+process.argv[1]+' increments '+process.argv[2]);
          " "${PKG_VERSION}" "${LATEST}"
      - name: Guard — skip if this version is already on npm
        id: guard
        shell: bash
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} already published — nothing to do"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke check
        if: steps.guard.outputs.published == 'false'
        run: npm test

      - name: Publish
        if: steps.guard.outputs.published == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
