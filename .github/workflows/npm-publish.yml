name: Publish to npm

# 发布流程：改 package.json 版本 → commit → 打 vX.Y.Z 标签并推送 → 自动发布到 npm。
# 手动触发（workflow_dispatch）则直接发布当前分支的版本。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance（来源证明）所需

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Guard — tag must match package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME}"
          echo "tag=${TAG_VERSION} package.json=${PKG_VERSION}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::git tag ${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Guard — skip if this version is already on npm
        id: guard
        shell: bash
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} already published — nothing to do"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke check
        if: steps.guard.outputs.published == 'false'
        run: npm test

      - name: Publish
        if: steps.guard.outputs.published == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
